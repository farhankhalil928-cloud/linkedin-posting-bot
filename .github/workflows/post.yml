name: LinkedIn Content Engine

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 16 * * *'

# Grant the action permission to commit files back to the repository
permissions:
  contents: write

jobs:
  post_to_linkedin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests google-genai

      - name: Run LinkedIn Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          
          GITHUB_TOKEN: ${{ secrets.MAINGIT_TOKEN }}
          GITHUB_OWNER: "farhankhalil217-ux"          
          GITHUB_REPO: "Solar-Metrix"       
          GITHUB_PATH: "posts"      
        run: python linkedin_engine.py

      # This new step commits the updated history.txt back to your repo
      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.txt
          git commit -m "Update posted history" || echo "No changes to commit"
          git push
